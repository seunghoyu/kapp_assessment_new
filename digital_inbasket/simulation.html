<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디지털 인바스켓 시뮬레이션</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .email-item {
            transition: all 0.2s ease;
        }
        .email-item:hover {
            transform: translateX(5px);
            background-color: #f3f4f6;
        }
        .email-item.selected {
            background-color: #e0e7ff;
            border-left: 4px solid #6366f1;
        }
        .action-btn {
            transition: all 0.2s ease;
        }
        .action-btn:hover {
            transform: scale(1.05);
        }
        .priority-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Progress Bar -->
    <div class="w-full bg-gray-200 h-2">
        <div id="progress-bar" class="bg-blue-600 h-2 transition-all duration-300" style="width: 0%"></div>
    </div>
    <div class="bg-white px-4 py-2 shadow-sm flex justify-between items-center">
        <span class="text-sm text-gray-600">진행률: <span id="progress-text">0</span>%</span>
        <button onclick="window.location.href='index.html'" class="text-sm text-blue-600 hover:text-blue-800">
            <i class="fas fa-arrow-left mr-1"></i>목록으로
        </button>
    </div>

    <!-- Main Content -->
    <div class="container mx-auto px-4 py-6">
        <!-- Header Card -->
        <div class="gradient-bg rounded-lg p-6 mb-6 text-white shadow-lg">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h1 class="text-2xl font-bold mb-2">
                        <i class="fas fa-inbox mr-2"></i>디지털 인바스켓 시뮬레이션
                    </h1>
                    <p class="text-sm opacity-90">실제 업무 환경에서의 우선순위 결정 및 조치 해결 능력을 측정합니다</p>
                    <p class="text-xs opacity-75 mt-1">
                        <i class="fas fa-lightbulb mr-1"></i>시뮬레이션이 시작되면 시간이 흐릅니다. 실전처럼 신속하고 정확하게 의사결정 하세요!
                    </p>
                </div>
                <div class="text-center bg-white text-gray-800 px-4 py-3 rounded-lg">
                    <div class="text-2xl font-bold" id="timer">10:00</div>
                    <div class="text-xs">제한 10분</div>
                </div>
            </div>
        </div>

        <!-- Simulation Content -->
        <div id="simulation-content">
            <!-- Content will be loaded here based on question type -->
        </div>

        <!-- Complete Button -->
        <div class="mt-6">
            <button onclick="completeSimulation()" class="w-full gradient-bg text-white py-4 rounded-lg font-bold text-lg hover:opacity-90 transition shadow-lg">
                완료하고 다음 단계로 (언제든지 가능)
            </button>
        </div>
    </div>

    <script src="js/simulation.js"></script>
</body>
</html>
