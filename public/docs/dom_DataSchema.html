<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메뉴 구조도</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Noto Sans KR', sans-serif; background: #e5e7eb; color: #374151; overflow: hidden; }
    .page {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      padding: 0.5rem;
      min-height: 0;
    }
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      padding: 0.4rem 0.6rem;
      background: #f9fafb;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      margin-bottom: 0.5rem;
    }
    .page-header h1 { margin: 0; font-size: 1rem; font-weight: 600; color: #374151; }
    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .zoom-controls button {
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid #9ca3af;
      border-radius: 6px;
      background: #fff;
      font-size: 1.1rem;
      line-height: 1;
      cursor: pointer;
      color: #374151;
    }
    .zoom-controls button:hover { background: #f3f4f6; border-color: #6b7280; }
    .zoom-controls span { font-size: 0.85rem; color: #6b7280; min-width: 3rem; text-align: center; }
    .tree-viewport {
      flex: 1;
      min-height: 0;
      overflow: auto;
      background: #f3f4f6;
      background-image:
        linear-gradient(#e5e7eb 1px, transparent 1px),
        linear-gradient(90deg, #e5e7eb 1px, transparent 1px);
      background-size: 12px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }
    .tree-canvas {
      display: inline-block;
      transform-origin: center center;
      flex-shrink: 0;
    }
    .tree-stage {
      position: relative;
      display: inline-block;
    }
    .tree-svg {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    .tree-nodes {
      position: relative;
      display: inline-block;
    }
    .node {
      position: absolute;
      white-space: nowrap;
      padding: 0.6rem 1rem;
      background: #ffffff;
      border: 1px solid #9ca3af;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #1f2937;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.15s, background-color 0.15s;
    }
    .node:hover {
      border-color: #4b5563;
      border-width: 2px;
      margin: -1px;
    }
    .node.selected {
      background: #e5e7eb;
      border-color: #6b7280;
      border-width: 2px;
      margin: -1px;
    }
    .node .route { font-size: 0.8rem; color: #6b7280; margin-top: 0.2rem; }
    .node.node-action .route { display: none; }
    .node.node-action { background: #f9fafb; border-style: dashed; }
    .node.node-action .label { font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <div>
        <h1>메뉴 구조도 (페이지 · 버튼 연결)</h1>
        <p style="margin: 0.25rem 0 0 0; font-size: 0.8rem; color: #6b7280;">시작: 상세페이지 → KAPP 진단하기 → 로그인 → (관리자 페이지로 이동 시 관리자 로그인 / 바로 로그인 시 개인회원 앱)</p>
      </div>
      <div class="zoom-controls">
        <button type="button" id="zoomOut" aria-label="축소">−</button>
        <span id="zoomLabel">100%</span>
        <button type="button" id="zoomIn" aria-label="확대">+</button>
      </div>
    </header>
    <div class="tree-viewport" id="treeViewport">
      <div class="tree-canvas" id="treeCanvas">
        <div class="tree-stage" id="treeStage">
          <svg class="tree-svg" id="treeSvg" aria-hidden="true"></svg>
          <div class="tree-nodes" id="treeNodes"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // ——— 페이지 정의 (id → label, route) ———
      var PAGES = {
        home: { label: '상세페이지 (시작)', route: '/' },
        login: { label: '로그인', route: '/login' },
        admin: { label: '관리자', route: '/admin' },
        dashboard: { label: '관리자 대시보드', route: '/dashboard' },
        app: { label: '앱 홈 (학습자)', route: '/app' },
        diagnosis: { label: 'KAPP 진단', route: '/app/diagnosis' },
        appDashboard: { label: '마이 대시보드', route: '/app/dashboard' },
        education: { label: '나의 교육', route: '/app/education' },
        growth: { label: '나의 성장', route: '/app/growth' }
      };

      // ——— 버튼/링크 연결 (from → [버튼명] → to) ———
      var EDGES = [
        { from: 'home', buttonLabel: 'KAPP 진단 시작하기', to: 'login' },
        { from: 'home', buttonLabel: '무료로 진단 시작하기', to: 'login' },
        { from: 'home', buttonLabel: 'KAPP 진단 (푸터)', to: 'login' },
        { from: 'home', buttonLabel: '관리자 페이지로 이동', to: 'admin' },
        { from: 'home', buttonLabel: '도입 문의 (1:1 상담)', to: 'admin' },
        { from: 'home', buttonLabel: '대시보드 (푸터)', to: 'app' },
        { from: 'login', buttonLabel: '로그인 (제출) → 개인회원', to: 'app' },
        { from: 'login', buttonLabel: '관리자 페이지로 이동 →', to: 'admin' },
        { from: 'admin', buttonLabel: '로그인 (제출) → 관리자', to: 'dashboard' },
        { from: 'admin', buttonLabel: '← 홈으로 돌아가기', to: 'home' },
        { from: 'app', buttonLabel: 'KAPP 진단 시작하기', to: 'diagnosis' }
      ];

      var nodeIdCounter = 0;
      function nextId() { return 'n' + (nodeIdCounter++); }
      var MAX_DEPTH = 7;

      function buildTree(fromPageId, depth) {
        if (depth > MAX_DEPTH) return null;
        var page = PAGES[fromPageId];
        if (!page) return null;
        var node = { type: 'page', id: nextId(), label: page.label, route: page.route, children: [] };
        var outEdges = EDGES.filter(function (e) { return e.from === fromPageId; });
        outEdges.forEach(function (e) {
          var actionNode = { type: 'action', id: nextId(), label: e.buttonLabel, route: '', children: [] };
          var targetNode = buildTree(e.to, depth + 1);
          if (targetNode) actionNode.children.push(targetNode);
          node.children.push(actionNode);
        });
        return node;
      }

      var TREE_DATA = [ buildTree('home', 0) ];

      // ——— 상수 (레퍼런스: 컴팩트 간격, 읽기 좋은 노드 크기) ———
      var NODE_WIDTH = 150;
      var NODE_HEIGHT = 46;
      var COL_GAP = 28;
      var ROW_GAP = 14;
      var CONNECTOR_HALF = 16;

      function getLayout(roots) {
        var layout = {};
        var row = 0;
        function countRows(items) {
          return items.reduce(function (s, it) {
            return s + (it.children && it.children.length ? countRows(it.children) : 1);
          }, 0);
        }
        function assign(items, depth) {
          items.forEach(function (item) {
            var children = item.children || [];
            if (children.length) {
              var startY = row;
              assign(children, depth + 1);
              var endY = row - 1;
              layout[item.id] = { item: item, depth: depth, x: depth, y: (startY + endY) / 2 };
            } else {
              layout[item.id] = { item: item, depth: depth, x: depth, y: row };
              row++;
            }
          });
        }
        assign(roots, 0);
        return layout;
      }

      function collectConnectors(roots, layout) {
        var conn = [];
        function walk(items) {
          items.forEach(function (item) {
            var children = item.children || [];
            if (children.length) {
              children.forEach(function (ch) {
                conn.push({ parent: item.id, child: ch.id });
              });
              walk(children);
            }
          });
        }
        walk(roots);
        return conn;
      }

      function px(nodeX, nodeY) {
        return {
          x: 2 * CONNECTOR_HALF + nodeX * (NODE_WIDTH + COL_GAP),
          y: 2 * CONNECTOR_HALF + nodeY * (NODE_HEIGHT + ROW_GAP)
        };
      }

      function escapeHtml(s) {
        if (s == null) return '';
        var div = document.createElement('div');
        div.textContent = s;
        return div.innerHTML;
      }

      function render() {
        nodeIdCounter = 0;
        TREE_DATA = [ buildTree('home', 0) ];
        var layout = getLayout(TREE_DATA);
        var connectors = collectConnectors(TREE_DATA, layout);
        var nodesContainer = document.getElementById('treeNodes');
        var svg = document.getElementById('treeSvg');
        nodesContainer.innerHTML = '';
        var maxX = 0, maxY = 0;
        Object.keys(layout).forEach(function (id) {
          var l = layout[id];
          if (l.x > maxX) maxX = l.x;
          if (l.y > maxY) maxY = l.y;
        });
        var totalW = 2 * CONNECTOR_HALF + (maxX + 1) * NODE_WIDTH + maxX * COL_GAP;
        var totalH = 2 * CONNECTOR_HALF + (maxY + 1) * NODE_HEIGHT + maxY * ROW_GAP;
        svg.setAttribute('width', totalW);
        svg.setAttribute('height', totalH);
        var arrowSize = 6;
        var defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
        var marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
        marker.setAttribute('id', 'arrow');
        marker.setAttribute('markerWidth', arrowSize);
        marker.setAttribute('markerHeight', arrowSize);
        marker.setAttribute('refX', arrowSize);
        marker.setAttribute('refY', arrowSize / 2);
        marker.setAttribute('orient', 'auto');
        var arrowPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        arrowPath.setAttribute('d', 'M0,0 L' + arrowSize + ',' + (arrowSize/2) + ' L0,' + arrowSize + ' Z');
        arrowPath.setAttribute('fill', '#6b7280');
        marker.appendChild(arrowPath);
        defs.appendChild(marker);
        svg.innerHTML = '';
        svg.appendChild(defs);
        var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        var d = [];
        connectors.forEach(function (c) {
          var p = layout[c.parent];
          var ch = layout[c.child];
          if (!p || !ch) return;
          var from = px(p.x, p.y);
          var to = px(ch.x, ch.y);
          var fromRight = from.x + NODE_WIDTH;
          var fromCy = from.y + NODE_HEIGHT / 2;
          var toLeft = to.x;
          var toCy = to.y + NODE_HEIGHT / 2;
          var midX = fromRight + CONNECTOR_HALF;
          d.push('M', fromRight, fromCy, 'H', midX, 'V', toCy, 'H', toLeft - arrowSize);
        });
        path.setAttribute('d', d.join(' '));
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', '#6b7280');
        path.setAttribute('stroke-width', '1');
        path.setAttribute('marker-end', 'url(#arrow)');
        svg.appendChild(path);
        Object.keys(layout).forEach(function (id) {
          var l = layout[id];
          var p = px(l.x, l.y);
          var el = document.createElement('div');
          el.className = 'node' + (l.item.type === 'action' ? ' node-action' : '');
          el.dataset.id = id;
          el.style.left = p.x + 'px';
          el.style.top = p.y + 'px';
          el.style.minWidth = NODE_WIDTH + 'px';
          el.style.minHeight = NODE_HEIGHT + 'px';
          var route = l.item.route ? escapeHtml(l.item.route) : '';
          el.innerHTML = '<span class="label">' + escapeHtml(l.item.label) + '</span>' + (route ? '<br><span class="route">' + route + '</span>' : '');
          nodesContainer.appendChild(el);
        });
        nodesContainer.style.width = totalW + 'px';
        nodesContainer.style.height = totalH + 'px';
        var stage = document.getElementById('treeStage');
        stage.style.width = totalW + 'px';
        stage.style.height = totalH + 'px';
        document.getElementById('treeCanvas').style.minWidth = totalW + 32 + 'px';
        document.getElementById('treeCanvas').style.minHeight = totalH + 32 + 'px';
        lastTreeW = totalW + 32;
        lastTreeH = totalH + 32;
      }

      var lastTreeW = 0, lastTreeH = 0;
      var minScale = 0.5;

      function fitToView() {
        if (lastTreeW <= 0 || lastTreeH <= 0) return;
        var vp = document.getElementById('treeViewport');
        var pad = 24;
        var fit = Math.min((vp.clientWidth - pad) / lastTreeW, (vp.clientHeight - pad) / lastTreeH);
        fit = Math.max(0.5, Math.min(1, fit));
        scale = fit;
        minScale = fit;
        applyZoom();
      }

      // 선택 상태
      document.getElementById('treeNodes').addEventListener('click', function (e) {
        var node = e.target.closest('.node');
        if (!node) return;
        document.querySelectorAll('.node.selected').forEach(function (n) { n.classList.remove('selected'); });
        node.classList.add('selected');
      });

      // 줌 (축소 제한: minScale 이하로 축소 불가)
      var scale = 1;
      var canvas = document.getElementById('treeCanvas');
      var viewport = document.getElementById('treeViewport');
      function applyZoom() {
        canvas.style.transform = 'scale(' + scale + ')';
        document.getElementById('zoomLabel').textContent = Math.round(scale * 100) + '%';
      }
      document.getElementById('zoomIn').addEventListener('click', function () {
        scale = Math.min(2, scale + 0.2);
        applyZoom();
      });
      document.getElementById('zoomOut').addEventListener('click', function () {
        scale = Math.max(minScale, scale - 0.2);
        applyZoom();
      });
      viewport.addEventListener('wheel', function (e) {
        if (!e.ctrlKey) return;
        e.preventDefault();
        if (e.deltaY < 0) scale = Math.min(2, scale + 0.08);
        else scale = Math.max(minScale, scale - 0.08);
        applyZoom();
      }, { passive: false });

      window.addEventListener('resize', function () { fitToView(); });

      render();
      fitToView();
    })();
  </script>
</body>
</html>
